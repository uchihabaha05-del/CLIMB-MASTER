<svg id="char" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" xmlns:c2pa="http://c2pa.org/manifest">
<title>Woman in a Pot (rigged)</title>
<defs>
<linearGradient id="skinV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0c7a4"/><stop offset=".55" stop-color="#d9a07a"/><stop offset="1" stop-color="#b87c58"/></linearGradient>
<radialGradient id="face" cx="42%" cy="38%" r="75%"><stop offset="0" stop-color="#f3cfae"/><stop offset=".65" stop-color="#dba37d"/><stop offset="1" stop-color="#b57854"/></radialGradient>
<radialGradient id="blush" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e0735f" stop-opacity=".45"/><stop offset="1" stop-color="#e0735f" stop-opacity="0"/></radialGradient>
<linearGradient id="tank" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2c3947"/><stop offset=".5" stop-color="#4a5c70"/><stop offset="1" stop-color="#27323e"/></linearGradient>
<linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a4a22"/><stop offset=".6" stop-color="#6b2e14"/><stop offset="1" stop-color="#3f1a0a"/></linearGradient>
<linearGradient id="potBody" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#121214"/><stop offset=".28" stop-color="#46474c"/><stop offset=".42" stop-color="#7a7b82"/><stop offset=".6" stop-color="#37383c"/><stop offset="1" stop-color="#101012"/></linearGradient>
<radialGradient id="inside" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#050506"/><stop offset="1" stop-color="#232326"/></radialGradient>
<radialGradient id="iris" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6fa07a"/><stop offset=".7" stop-color="#2f5a42"/><stop offset="1" stop-color="#16301f"/></radialGradient>
<filter id="rust" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".03 .05" numOctaves="4" seed="11"/><feColorMatrix type="matrix" values="0 0 0 0 .48  0 0 0 0 .24  0 0 0 0 .1  0 0 0 1.4 -.5"/></filter>
<filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
<clipPath id="potClip"><path id="potShape" d="M120,430 A180,34 0 0 0 480,430 C505,470 520,520 505,570 C490,625 430,660 300,662 C170,660 110,625 95,570 C80,520 95,470 120,430 Z"/></clipPath>
</defs>

<ellipse cx="300" cy="672" rx="200" ry="14" fill="#000" opacity=".4" filter="url(#blur)"/>

<g id="pot-back"><ellipse cx="300" cy="430" rx="180" ry="34" fill="#2a2a2e"/><ellipse cx="300" cy="430" rx="168" ry="28" fill="url(#inside)"/></g>

<g id="character">
 <!-- ponytail (behind) -->
 <g id="ponytail"><path d="M338,160 C398,150 420,215 398,275 C390,300 372,310 364,296 C380,258 372,215 338,198 Z" fill="url(#hair)" stroke="#2e1307" stroke-width="2"/>
 <path d="M372,175 C396,200 392,250 378,285 M362,190 C380,215 376,250 368,280" fill="none" stroke="#c77a45" stroke-width="2" opacity=".5"/></g>

 <!-- torso -->
 <g id="torso">
  <path d="M276,250 L324,250 L334,296 L266,296 Z" fill="#c78d66"/>
  <path d="M276,250 L324,250 L326,262 Q300,276 274,262 Z" fill="#a8704d" opacity=".55"/>
  <path d="M232,476 C226,420 208,382 210,338 C212,306 242,292 266,286 L334,286 C358,292 388,306 390,338 C392,382 374,420 368,476 Z" fill="url(#tank)" stroke="#1b232c" stroke-width="2"/>
  <path d="M258,288 Q300,336 342,288 Q300,300 258,288 Z" fill="#d1966e"/>
  <path d="M258,288 Q300,336 342,288" fill="none" stroke="#1b232c" stroke-width="3"/>
  <path d="M272,296 Q286,300 296,297 M328,296 Q314,300 304,297" fill="none" stroke="#a46d4a" stroke-width="2" opacity=".8"/>
  <path d="M252,378 q10,28 6,66 M348,378 q-10,28 -6,66 M300,345 q-3,45 0,100" fill="none" stroke="#141b22" stroke-width="2.6" opacity=".4" stroke-linecap="round"/>
 </g>

 <!-- LEFT ARM (mirrored rig). pivot = shoulder (222,325) -->
 <g id="armL" transform="translate(222 325) scale(-1 1)">
  <g id="armL-upper" transform="rotate(88.2)">
   <path d="M0,-18 C24,-22 54,-17 78,-13 L78,13 C54,16 24,20 0,21 Z" fill="url(#skinV)" stroke="#7a4a30" stroke-width="2"/>
   <path d="M14,-12 C34,-16 52,-12 66,-8" fill="none" stroke="#fbdcc0" stroke-width="5" stroke-linecap="round" opacity=".4"/>
   <circle cx="0" cy="1" r="20" fill="url(#skinV)"/>
   <g id="armL-fore" transform="translate(78 0) rotate(-69.5)">
    <path d="M0,-13 C24,-15 52,-11 74,-9 L74,9 C52,11 24,13 0,15 Z" fill="url(#skinV)" stroke="#7a4a30" stroke-width="2"/>
    <path d="M12,-9 C30,-11 50,-8 66,-5" fill="none" stroke="#fbdcc0" stroke-width="4" stroke-linecap="round" opacity=".4"/>
    <path d="M18,6 C30,8 46,6 58,3" fill="none" stroke="#9c6544" stroke-width="2" opacity=".6"/>
    <circle cx="0" cy="1" r="14" fill="url(#skinV)"/>
    <g id="handL" transform="translate(84 0)">
     <ellipse cx="0" cy="0" rx="21" ry="18" fill="url(#skinV)" stroke="#7a4a30" stroke-width="2.4"/>
     <path d="M-6,-14 q8,14 0,28 M4,-15 q8,15 0,30 M13,-12 q6,12 0,24" fill="none" stroke="#7a4a30" stroke-width="2" stroke-linecap="round"/>
     <path d="M-18,-6 q10,-10 22,-8" fill="none" stroke="#7a4a30" stroke-width="2" stroke-linecap="round"/>
    </g>
   </g>
  </g>
 </g>

 <!-- RIGHT ARM. pivot = shoulder (378,325) -->
 <g id="armR" transform="translate(378 325)">
  <g id="armR-upper" transform="rotate(41.7)">
   <path d="M0,-18 C24,-22 54,-17 78,-13 L78,13 C54,16 24,20 0,21 Z" fill="url(#skinV)" stroke="#7a4a30" stroke-width="2"/>
   <path d="M14,-12 C34,-16 52,-12 66,-8" fill="none" stroke="#fbdcc0" stroke-width="5" stroke-linecap="round" opacity=".4"/>
   <circle cx="0" cy="1" r="20" fill="url(#skinV)"/>
   <g id="armR-fore" transform="translate(78 0) rotate(-108)">
    <path d="M0,-13 C24,-15 52,-11 74,-9 L74,9 C52,11 24,13 0,15 Z" fill="url(#skinV)" stroke="#7a4a30" stroke-width="2"/>
    <path d="M12,-9 C30,-11 50,-8 66,-5" fill="none" stroke="#fbdcc0" stroke-width="4" stroke-linecap="round" opacity=".4"/>
    <path d="M18,6 C30,8 46,6 58,3" fill="none" stroke="#9c6544" stroke-width="2" opacity=".6"/>
    <circle cx="0" cy="1" r="14" fill="url(#skinV)"/>
    <g id="handR" transform="translate(84 0)">
     <ellipse cx="0" cy="0" rx="21" ry="18" fill="url(#skinV)" stroke="#7a4a30" stroke-width="2.4"/>
     <path d="M-6,-14 q8,14 0,28 M4,-15 q8,15 0,30 M13,-12 q6,12 0,24" fill="none" stroke="#7a4a30" stroke-width="2" stroke-linecap="round"/>
     <path d="M-18,-6 q10,-10 22,-8" fill="none" stroke="#7a4a30" stroke-width="2" stroke-linecap="round"/>
    </g>
   </g>
  </g>
 </g>

 <!-- head -->
 <g id="head">
  <ellipse cx="256" cy="214" rx="7" ry="12" fill="#c98f68" stroke="#7a4a30" stroke-width="1.5"/>
  <ellipse cx="344" cy="214" rx="7" ry="12" fill="#c98f68" stroke="#7a4a30" stroke-width="1.5"/>
  <path d="M256,196 C254,250 272,280 300,284 C328,280 346,250 344,196 C344,160 326,148 300,148 C274,148 256,160 256,196 Z" fill="url(#face)" stroke="#7a4a30" stroke-width="2"/>
  <ellipse cx="274" cy="238" rx="17" ry="12" fill="url(#blush)"/><ellipse cx="326" cy="238" rx="17" ry="12" fill="url(#blush)"/>
  <!-- freckles -->
  <g fill="#9a5f3d" opacity=".55"><circle cx="268" cy="232" r="1.4"/><circle cx="276" cy="236" r="1.3"/><circle cx="284" cy="231" r="1.2"/><circle cx="272" cy="242" r="1.2"/><circle cx="316" cy="231" r="1.2"/><circle cx="324" cy="236" r="1.3"/><circle cx="332" cy="232" r="1.4"/><circle cx="328" cy="242" r="1.2"/><circle cx="300" cy="224" r="1.1"/></g>
  <!-- eyes -->
  <path d="M271,209 Q282,200 293,209 Q282,216 271,209 Z" fill="#f3eee6" stroke="#3b261a" stroke-width="1.4"/>
  <circle cx="282.5" cy="208.5" r="5" fill="url(#iris)"/><circle cx="282.5" cy="208.5" r="2.2" fill="#050505"/><circle cx="284.5" cy="206.5" r="1.3" fill="#fff"/>
  <path d="M271,209 Q282,198 293,209" fill="none" stroke="#2a170e" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M307,209 Q318,200 329,209 Q318,216 307,209 Z" fill="#f3eee6" stroke="#3b261a" stroke-width="1.4"/>
  <circle cx="317.5" cy="208.5" r="5" fill="url(#iris)"/><circle cx="317.5" cy="208.5" r="2.2" fill="#050505"/><circle cx="319.5" cy="206.5" r="1.3" fill="#fff"/>
  <path d="M307,209 Q318,198 329,209" fill="none" stroke="#2a170e" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M272,217 q10,5 20,0 M308,217 q10,5 20,0" fill="none" stroke="#b27652" stroke-width="1.4" opacity=".7"/>
  <!-- brows -->
  <path d="M268,196 Q281,189 295,195" fill="none" stroke="#4a210f" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M305,195 Q319,189 332,196" fill="none" stroke="#4a210f" stroke-width="3.6" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M296,212 q-5,18 -7,24 q11,7 22,0 q-2,-6 -7,-24" fill="#d59a73" stroke="#9a5f3d" stroke-width="1.4" stroke-linejoin="round" opacity=".9"/>
  <path d="M291,238 q9,5 18,0" fill="none" stroke="#7a4a30" stroke-width="1.8" stroke-linecap="round"/>
  <!-- mouth -->
  <path d="M284,262 Q292,256 300,259 Q308,256 316,262 Q300,270 284,262 Z" fill="#b5524f" stroke="#7a2f2f" stroke-width="1.2"/>
  <path d="M286,263 Q300,267 314,263" fill="none" stroke="#6b2626" stroke-width="1.6"/>
  <path d="M292,267 Q300,271 308,267" fill="none" stroke="#e79a90" stroke-width="2" opacity=".55"/>
  <!-- hair -->
  <path d="M252,200 C244,142 278,112 306,112 C338,112 356,142 348,200 C346,170 330,150 300,148 C274,150 256,170 252,200 Z" fill="url(#hair)" stroke="#2e1307" stroke-width="2"/>
  <path d="M300,146 C276,152 262,176 254,208 C262,196 278,166 304,150 Z" fill="url(#hair)" stroke="#2e1307" stroke-width="1.5"/>
  <path d="M276,128 C290,118 316,118 330,128 M268,142 C285,128 320,126 338,140" fill="none" stroke="#d58a52" stroke-width="2.4" opacity=".5" stroke-linecap="round"/>
  <!-- bandana -->
  <path d="M252,170 Q300,140 348,168 L347,184 Q300,158 253,186 Z" fill="#a22a2a" stroke="#5a1313" stroke-width="1.8"/>
  <g fill="#e8c9b0" opacity=".6"><circle cx="270" cy="170" r="1.8"/><circle cx="290" cy="160" r="1.8"/><circle cx="312" cy="160" r="1.8"/><circle cx="332" cy="170" r="1.8"/></g>
  <path d="M346,172 q16,2 20,16 q-12,-4 -22,-2 Z" fill="#a22a2a" stroke="#5a1313" stroke-width="1.5"/>
 </g>
</g>

<g id="pot-front">
 <use href="#potShape" fill="url(#potBody)"/>
 <g clip-path="url(#potClip)">
  <rect x="80" y="420" width="450" height="260" filter="url(#rust)" opacity=".6"/>
  <path d="M110,540 Q300,578 500,540" fill="none" stroke="#08080a" stroke-width="3" opacity=".5"/>
  <path d="M300,466 L300,662" stroke="#08080a" stroke-width="2" opacity=".45"/>
  <ellipse cx="212" cy="525" rx="34" ry="92" fill="#fff" opacity=".07" transform="rotate(12 212 525)"/>
  <ellipse cx="300" cy="640" rx="170" ry="30" fill="#000" opacity=".3"/>
 </g>
 <path d="M120,430 A180,34 0 0 0 480,430" fill="none" stroke="#242428" stroke-width="15" stroke-linecap="round"/>
 <path d="M122,427 A178,32 0 0 0 478,427" fill="none" stroke="#9a9ba2" stroke-width="3.5" stroke-linecap="round" opacity=".75"/>
 <path d="M104,456 C68,456 58,492 92,502 M496,456 C532,456 542,492 508,502" fill="none" stroke="#1b1b1e" stroke-width="12" stroke-linecap="round"/>
 <path d="M170,640 l-10,28 h32 l6,-24 Z M430,640 l10,28 h-32 l-6,-24 Z" fill="#141416"/>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
