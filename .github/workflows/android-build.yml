name: Godot Validation

on:
  push:
    branches: [rebuild/physics-core]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Smoke test the playable scene
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 120 2>&1 | tee /tmp/climb-master-smoke.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|ERROR: Resource file not found|ERROR: Can.t open file|ERROR: No loader found|ERROR: Failed loading resource|Non-existing or invalid boot splash" /tmp/climb-master-smoke.log; then
            echo "Godot smoke test found a scene, script or resource loading error."
            exit 1
          fi

      - name: Run 2D physics headless tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_climb_physics_2d.gd 2>&1 | tee /tmp/climb-physics-tests.log
